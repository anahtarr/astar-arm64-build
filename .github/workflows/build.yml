name: Build Astar v5.50.0 ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout Astar (pinned to verified v5.50.0 commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AstarNetwork/Astar
          ref: f826a2c7e7c8c5d96806bd77f8413bca6e7f511b
          submodules: recursive

      - name: Show checked-out commit
        run: |
          git rev-parse HEAD
          git submodule status --recursive
          test "$(git rev-parse HEAD)" = "f826a2c7e7c8c5d96806bd77f8413bca6e7f511b"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config \
            libssl-dev protobuf-compiler libclang-dev

      - name: Rust toolchain check
        run: |
          rustup show
          rustc -Vv
          cargo -V
          uname -m
          rustup target list --installed | grep wasm32v1-none

      - name: Disk before build
        run: df -h /

      - name: Build astar-collator
        env:
          CARGO_INCREMENTAL: "0"
        run: cargo build --profile production --locked --bin astar-collator

      - name: Disk after build
        if: always()
        run: df -h /

      - name: Verify binary
        run: |
          file target/production/astar-collator
          target/production/astar-collator --version
          ldd target/production/astar-collator
          sha256sum target/production/astar-collator

      - name: Package
        run: |
          tar -C target/production -czf astar-collator-v5.50.0-linux-aarch64.tar.gz astar-collator
          sha256sum astar-collator-v5.50.0-linux-aarch64.tar.gz | tee astar-collator-v5.50.0-linux-aarch64.tar.gz.sha256

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astar-collator-v5.50.0-linux-aarch64
          path: |
            astar-collator-v5.50.0-linux-aarch64.tar.gz
            astar-collator-v5.50.0-linux-aarch64.tar.gz.sha256
